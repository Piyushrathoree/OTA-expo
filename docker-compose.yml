services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ota}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: ./api
    profiles: ["api", "app"]
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-change_me}@mysql:3306/${MYSQL_DATABASE:-ota}?allowPublicKeyRetrieval=true
      PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build: ./app
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-}
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "${METRO_PORT:-8081}:${METRO_PORT:-8081}"
    stdin_open: true
    tty: true
    command: ["npx", "expo", "start", "--lan", "--port", "${METRO_PORT:-8081}"]

volumes:
  mysql_data:
